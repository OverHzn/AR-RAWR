[package]
name = "transcript-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of the pure functions of the external norma/transcript package (Messages, LastUUID), parity-tested against the real Go transcript package"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
llm-rs = { path = "../llm-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }