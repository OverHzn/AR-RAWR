[package]
name = "artex"
version = "0.1.0"
edition = "2021"
publish = false
description = "ARTEX rewritten in Rust — full-application port (server, db, agent, traffic, …). Pure helper parity crates live under rust/*-rs; this crate is the real app."

[dependencies]
gocompat = { path = "../gocompat" }
llm-rs = { path = "../llm-rs" }
sidequestion-rs = { path = "../sidequestion-rs" }
notify-rs = { path = "../notify-rs" }
notifyx-rs = { path = "../notifyx-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# SMTP transport (email channel): TLS via rustls with the ring provider (NOT the
# default aws-lc-rs, which is not available offline). Pinned to the versions
# already resolved in Cargo.lock so the build stays offline-friendly.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[lints.clippy]
all = { level = "warn", priority = -1 }