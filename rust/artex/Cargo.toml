[package]
name = "artex"
version = "0.1.0"
edition = "2021"
publish = false
description = "ARTEX rewritten in Rust — full-application port (server, db, agent, traffic, …). Pure helper parity crates live under rust/*-rs; this crate is the real app."

[dependencies]
gocompat = { path = "../gocompat" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
all = { level = "warn", priority = -1 }