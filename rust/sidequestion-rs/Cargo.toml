[package]
name = "sidequestion-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `sidequestion/` pure helpers (Parent::key, budgets, messageGroups, EstimateInputTokens), parity-tested against Go-recorded cases"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
compaction-rs = { path = "../compaction-rs" }
llm-rs = { path = "../llm-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }