[package]
name = "mcphttpx-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `mcphttp/` unexported pure helpers (header normalization, unsupported-version detection), parity-tested against Go-recorded cases"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gocompat = { path = "../gocompat" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }