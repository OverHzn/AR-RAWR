[package]
name = "tool-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of the pure helpers of the external norma/tool package (Text, Errorf, RenderDeferredToolsBlock, RenderTodoReminder), parity-tested against the real Go tool package"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
llm-rs = { path = "../llm-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }